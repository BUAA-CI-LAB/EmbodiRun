version: 2

# Use this file for both RTD projects. Set the Chinese project's language to
# zh-cn and add it under the English project's Translations settings.
# RTD supplies READTHEDOCS_LANGUAGE; mkdocs keeps the default dependency install.

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    build:
      html:
        - |
          if [ "${READTHEDOCS_LANGUAGE:-en}" = "zh-cn" ]; then
            mkdocs build --strict -f mkdocs.zh.yml -d "$READTHEDOCS_OUTPUT/html"
          else
            mkdocs build --strict -f mkdocs.yml -d "$READTHEDOCS_OUTPUT/html"
          fi

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
