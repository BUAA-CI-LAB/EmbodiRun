# Run on a Linux GPU workstation with VLABench task assets prepared.
# Official VLABench/pi05-primitive-10task, revision f658a8b.
# source is a local OpenPI bundle: params/ plus an explicit openpi_config.json.
# EmbodiInfer requires its pi05 and pi05-openpi extras; it caches the converted tensors.
# Examples use ports 8000/8100: stop one before starting another, or change ports.
metadata:
  name: vlabench-pi05-embodiinfer
  deploy-commit: d5d2991157eb168481e32ebe6249ebdd4dfc20b7

nodes:
  workstation:
    type: workstation
    connection:
      type: local

simulators:
  vlabench-01:
    type: vlabench
    node: workstation
    task: select_fruit
    max_episode_steps: 500
    width: 480
    height: 480
    viewer: true # Requires a working display on the simulator node.

models:
  pi05-01:
    backend: embodiinfer
    transport: http
    type: pi05
    node: workstation
    gpu: cuda:0
    environment: .venv-embodiinfer-pi05
    source: /models/pi05_vlabench_primitive
    # OpenPI camera slot names are generic; map by the checkpoint's training order.
    image_keys:
      observation.images.image: observation.images.base_0_rgb
      observation.images.second_image: observation.images.left_wrist_0_rgb
      observation.images.wrist_image: observation.images.right_wrist_0_rgb
    server:
      bind: 127.0.0.1
      port: 8000

runtimes:
  vlabench-pi05-runtime:
    simulator: vlabench-01
    model: pi05-01
    binding: franka.panda.pi05
    server:
      bind: 127.0.0.1
      port: 8100
