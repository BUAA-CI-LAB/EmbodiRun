# Run on a Linux GPU workstation with VLABench task assets prepared.
# Replace the checkpoint path with an SGLang-compatible Pi0.5 policy for this task.
# Examples use ports 8000/8100: stop one before starting another, or change ports.
metadata:
  name: vlabench-pi05-sglang
  deploy-commit: 7c96609060e6da34fd5ba885e08aa47cd8d67427

nodes:
  workstation:
    type: workstation
    connection:
      type: local

simulators:
  vlabench-01:
    type: vlabench
    node: workstation
    task: select_fruit
    max_episode_steps: 500
    width: 480
    height: 480
    viewer: false # Set true only when the simulator node has a working display.

models:
  pi05-01:
    backend: sglang
    transport: http
    type: pi05
    node: workstation
    gpu: cuda:0
    environment: .venv-sglang-pi05
    environment_packages:
      - "sglang[diffusion]==0.5.18"
    # Image keys default to image/second_image/wrist_image; match the checkpoint.
    source: /data/models/pi05-vlabench
    output_action_dim: 7 # Remove padded dimensions before the Panda action mapper.
    parameters:
      action_horizon: 50
    server:
      bind: 127.0.0.1
      port: 8000

runtimes:
  vlabench-pi05-runtime:
    simulator: vlabench-01
    model: pi05-01
    binding: franka.panda.pi05
    server:
      bind: 127.0.0.1
      port: 8100
