# Run on a Linux GPU workstation with LIBERO task assets prepared.
# Uses this workstation's downloaded LIBERO fine-tune and SGLang environment.
# Deploy's opt-in SGLang compatibility pipeline restores LeRobot processors.
# Update the absolute paths when running on another machine.
# Examples use ports 8000/8100: stop one before starting another, or change ports.
metadata:
  name: libero-pi05-sglang
  deploy-commit: c3f939a4f2dda25b76560f65f1bd9a2d468fb4f8

nodes:
  workstation:
    type: workstation
    connection:
      type: local

simulators:
  libero-01:
    type: libero
    node: workstation
    suite: libero_spatial
    task_id: 0
    max_episode_steps: 500
    width: 256
    height: 256
    viewer: true # Requires a working display on the simulator node.

models:
  pi05-01:
    backend: sglang
    transport: http
    type: pi05
    node: workstation
    gpu: cuda:0
    environment: ./.venv-sglang
    environment_packages:
      - ".[sglang]"
    source: /models/pi05_libero_finetuned
    server_executable: embodirun-sglang-serve
    pipeline: LeRobotPi05Pipeline
    image_keys:
      observation.images.image: image
      observation.images.wrist_image: image2
    output_action_dim: 7 # Remove padded dimensions before the Panda action mapper.
    parameters:
      action_horizon: 50
    server:
      bind: 127.0.0.1
      port: 8000

runtimes:
  libero-pi05-runtime:
    simulator: libero-01
    model: pi05-01
    binding: franka.panda.pi05
    server:
      bind: 127.0.0.1
      port: 8100
