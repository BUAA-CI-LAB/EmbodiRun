# Run on a Linux GPU workstation with LIBERO task assets prepared.
# The checkpoint path below uses this workstation's downloaded LIBERO fine-tune.
# Update source when running on a different machine.
# Examples use ports 8000/8100: stop one before starting another, or change ports.
metadata:
  name: libero-pi05-vvla
  deploy-commit: c3f939a4f2dda25b76560f65f1bd9a2d468fb4f8

nodes:
  workstation:
    type: workstation
    connection:
      type: local

simulators:
  libero-01:
    type: libero
    node: workstation
    suite: libero_spatial
    task_id: 0
    max_episode_steps: 500
    width: 256
    height: 256
    viewer: true # Requires a working display on the simulator node.

models:
  pi05-01:
    backend: vvla
    transport: http
    type: pi05
    node: workstation
    gpu: cuda:0
    environment: .venv-vvla-pi05
    # LeRobot Pi0.5 LIBERO fine-tune, revision 8e174154 (8D state / 7D actions).
    source: /models/pi05_libero_finetuned
    image_keys:
      observation.images.image: observation.images.image
      observation.images.wrist_image: observation.images.image2
    server:
      bind: 127.0.0.1
      port: 8000

runtimes:
  libero-pi05-runtime:
    simulator: libero-01
    model: pi05-01
    binding: franka.panda.pi05
    server:
      bind: 127.0.0.1
      port: 8100
