<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="951" viewBox="0 0 1584 951" role="img" aria-labelledby="title desc">
<title id="title">XLeRobot 薯片递送 Demo：系统组成与 Model / Agent 分工</title>
<desc id="desc">用户提供任务与录制路线或示意图。RPent 编排任务和工具，可选 Astra 模型只读判断场景并选择抓取指令。EmbodiRun 管理部署、观测、模型调用、动作执行与停止。EmbodiInfer 承载 π0.5 抓取策略。XLeRobot owner 访问双 SO-101 臂、差速底盘、前视和双腕相机，管理限位、反馈和停止确认。递送流程包含去取物点、抓取、确认持物、返回和伸臂交付。</desc>
<metadata>{"purpose":"snack-delivery-demo-system-and-model-roles","editable_text":true,"layout":"agent above local runtime and model compute","astra":"optional read-only reviewer"}</metadata>
