version: 1
name: multi-robot-serving
kind: rollout
output_dir: ../../artifacts/examples/multi-robot-serving
parameters:
  deployment: deployment.yaml
  runtimes: [arm-1, arm-2, arm-3]
  prompt: Pick up the cube and place it in the bowl.
  chunks: 15
  chunk_steps: 50
  control_hz: 20
  request_timeout: 120
