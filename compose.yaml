services:
  host:
    build:
      context: .
      target: host
    image: embodirun-examples:host
    init: true
    stdin_open: true
    tty: true
    volumes:
      - ./examples/local:/workspace
    command: [--help]
  xlerobot:
    profiles: [hardware]
    build:
      context: .
      target: xlerobot
    image: embodirun-examples:xlerobot
    init: true
    stdin_open: true
    tty: true
    network_mode: host
    stop_grace_period: 70s
    volumes:
      - ./examples/local:/workspace
    # Add explicit devices and read-only SDK/calibration mounts in compose.local.yaml.
    # No privileged mode or automatic hardware startup.
    command: [--help]
  microduck:
    profiles: [gpu]
    build:
      context: .
      target: microduck
    image: embodirun-examples:microduck
    runtime: nvidia
    init: true
    stdin_open: true
    tty: true
    stop_grace_period: 70s
    volumes:
      - ./examples/local:/workspace
      - ${MICRODUCK_ASSETS:-./examples/local/microduck/assets}:/assets:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: [--help]
