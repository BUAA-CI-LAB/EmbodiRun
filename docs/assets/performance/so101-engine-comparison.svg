<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 360" role="img" aria-labelledby="title description">
<title id="title">SO-101 engine comparison: recorded medians</title>
<desc id="description">Jetson AGX Thor Developer Kit, 15 chunks per configuration. Inference medians (ms): 162, 170, 194, 1061. Full-chunk medians (ms): 2660, 2666, 2713, 3592. Source: published SO-101 engine comparison.</desc>
