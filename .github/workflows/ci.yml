name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: CPU tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.x"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Run the CPU test suite
        run: uv run --frozen pytest -q

      - name: Check the public entry points
        run: |
          uv run --frozen embodirun --help
          uv run --frozen python -c "import embodirun, embodirun.client, embodirun.application, embodirun.deployment, embodirun.devices, embodirun.model_services"

  microduck-software:
    name: MicroDuck software (native + Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.x"
          enable-cache: false

      - name: Install the native software Recipe from its frozen lock
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/microduck-downloads
        run: |
          uv sync --frozen --python 3.12 --no-default-groups --group host
          EMBODIRUN_SCENE_PYTHON="$RUNNER_TEMP/microduck environment/bin/python" \
            .venv/bin/embodirun example examples/microduck_vln/example.yaml setup --mode software

      - name: Check both native entrypoints and printed commands
        run: |
          "$RUNNER_TEMP/microduck environment/bin/python" scripts/check_microduck_software.py \
            --report "$RUNNER_TEMP/microduck-native.json"

      - name: Set up an isolated Docker builder
        uses: docker/setup-buildx-action@v4

      - name: Build the production software Docker target
        run: docker buildx build --load --no-cache --target microduck-software --tag microduck-software-ci .

      - name: Check the container as the host UID and compare locked inventories
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD/scripts/check_microduck_software.py,target=/check.py,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP,target=/workspace" \
            --entrypoint /opt/venv/bin/python microduck-software-ci /check.py \
            --source-root /opt/embodirun --work-dir /workspace --report /workspace/microduck-docker.json
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          native = json.loads((root / "microduck-native.json").read_text())
          docker = json.loads((root / "microduck-docker.json").read_text())
          assert native["packages"] == docker["packages"], "Native/container locked packages differ"
          print(f"Native/container parity: {len(native['packages'])} packages")
          PY

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.x"
          enable-cache: true

      # The dev group alone: ruff and pytest, without the accelerator stack.
      - name: Install the lint tooling
        run: uv sync --frozen --only-group dev --no-install-project

      - name: Check
        run: |
          .venv/bin/ruff check src tests benchmarks examples agents integrations scripts
          .venv/bin/ruff format --check src tests benchmarks examples agents integrations scripts

  docs:
    name: Docs (strict)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the recorded performance figure
        run: python benchmarks/engine-comparison/generate_plot.py --check

      - name: Build the documentation
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict

      # The Simplified Chinese site is a separate Read the Docs project built
      # from this repository, so it has to keep building here.
      - name: Build the Simplified Chinese documentation
        run: mkdocs build --strict -f mkdocs.zh.yml
